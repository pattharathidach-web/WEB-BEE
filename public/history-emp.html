<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลสุขภาพย้อนหลัง - ตลาดสดใส ใส่ใจน้ำตาล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%9A</text></svg>">
    <link rel="stylesheet" href="style.css">
    <noscript><style>html{visibility:visible!important}</style></noscript>
    <script src="auth.js"></script>
    <script>window.__user = guardPage('employee');</script>
</head>
<body class="bg-green-50/50 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-emerald-800 text-emerald-50 flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 p-2 mb-6 bg-white/10 rounded-xl">
                <span class="text-xl">💚</span>
                <span class="font-bold text-white text-sm">ตลาดสดใส ใส่ใจน้ำตาล</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard-emp.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-xl text-sm transition">🏠 หน้าหลัก</a>
                <a aria-current="page" href="history-emp.html" class="flex items-center gap-3 px-4 py-3 bg-emerald-600 text-white rounded-xl text-sm shadow-sm">📊 ข้อมูลสุขภาพย้อนหลัง</a>
                <a href="csr-schedule.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-xl text-sm transition">📅 ตารางกิจกรรม CSR</a>
            </nav>
        </div>
        <a href="#" onclick="logout(); return false;" class="flex items-center gap-3 px-4 py-3 hover:bg-red-500/20 text-red-300 rounded-xl text-sm transition">🚪 ออกจากระบบ</a>
    </aside>

    <main class="flex-1 p-8">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-emerald-50">
            <div class="mb-6 border-b pb-4">
                <h2 class="text-xl font-bold text-gray-800">ประวัติการตรวจสุขภาพของคุณ</h2>
                <p class="text-sm text-gray-500 mt-1" data-user-fullname>-</p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-500 bg-emerald-50 border-y border-emerald-100">
                        <tr>
                            <th class="px-4 py-3 font-medium">วันที่ตรวจ</th>
                            <th class="px-4 py-3 font-medium">น้ำหนัก (kg)</th>
                            <th class="px-4 py-3 font-medium">BMI</th>
                            <th class="px-4 py-3 font-medium">ความดันโลหิต</th>
                            <th class="px-4 py-3 font-medium">น้ำตาลในเลือด</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody" class="divide-y divide-gray-100"></tbody>
                </table>
                <p id="emptyState" class="text-center text-sm text-gray-400 py-8 hidden">ยังไม่มีข้อมูลการตรวจสุขภาพ</p>
            </div>
        </div>
    </main>

    <script src="data.js"></script>
    <script>
        const currentUser = window.__user;
        if (currentUser) {
            paintUser(currentUser);
            const myRecords = getRecords().filter(r => r.fullname === currentUser.fullname);
            const body = document.getElementById('resultsBody');
            const empty = document.getElementById('emptyState');
            if (myRecords.length === 0) {
                empty.classList.remove('hidden');
            } else {
                myRecords
                    .sort((a, b) => a.date.split('/').reverse().join('').localeCompare(b.date.split('/').reverse().join('')))
                    .forEach(r => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-50';
                        tr.innerHTML = `
                            <td class="px-4 py-4">${r.date}</td>
                            <td class="px-4 py-4">${r.weight}</td>
                            <td class="px-4 py-4 text-emerald-600 font-medium">${r.bmi}</td>
                            <td class="px-4 py-4">${r.bp}</td>
                            <td class="px-4 py-4">${r.sugar}</td>`;
                        body.appendChild(tr);
                    });
            }
        }
    </script>
</body>
</html>
