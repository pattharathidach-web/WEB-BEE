<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลสุขภาพย้อนหลัง - ตลาดสดใส ใส่ใจน้ำตาล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-green-50/50 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-emerald-800 text-emerald-50 flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 p-2 mb-6 bg-white/10 rounded-xl">
                <span class="text-xl">💚</span>
                <span class="font-bold text-white text-sm">ตลาดสดใส ใส่ใจน้ำตาล</span>
            </div>
            <nav class="space-y-1">
                <a href="/dashboard-emp" class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-xl text-sm transition">🏠 หน้าหลัก</a>
                <a href="/history-emp" class="flex items-center gap-3 px-4 py-3 bg-emerald-600 text-white rounded-xl text-sm shadow-sm">📊 ข้อมูลสุขภาพย้อนหลัง</a>
                <a href="/csr-schedule" class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-xl text-sm transition">📅 ตารางกิจกรรม CSR</a>
            </nav>
        </div>
        <a href="/logout" class="flex items-center gap-3 px-4 py-3 hover:bg-red-500/20 text-red-300 rounded-xl text-sm transition">🚪 ออกจากระบบ</a>
    </aside>

    <main class="flex-1 p-8">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-emerald-50">
            <div class="mb-6 border-b pb-4">
                <h2 class="text-xl font-bold text-gray-800">ประวัติการตรวจสุขภาพของคุณ</h2>
                <p class="text-sm text-gray-500 mt-1">นายสมชาย รักสุข</p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-500 bg-emerald-50 border-y border-emerald-100">
                        <tr>
                            <th class="px-4 py-3 font-medium">วันที่ตรวจ</th>
                            <th class="px-4 py-3 font-medium">น้ำหนัก (kg)</th>
                            <th class="px-4 py-3 font-medium">BMI</th>
                            <th class="px-4 py-3 font-medium">ความดันโลหิต</th>
                            <th class="px-4 py-3 font-medium">น้ำตาลในเลือด</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr class="hover:bg-slate-50">
                            <td class="px-4 py-4">12/05/2567</td>
                            <td class="px-4 py-4">65</td>
                            <td class="px-4 py-4 text-emerald-600 font-medium">22.5</td>
                            <td class="px-4 py-4">120/80</td>
                            <td class="px-4 py-4">110</td>
                        </tr>
                        <tr class="hover:bg-slate-50">
                            <td class="px-4 py-4">10/02/2567</td>
                            <td class="px-4 py-4">64</td>
                            <td class="px-4 py-4 text-emerald-600 font-medium">22.1</td>
                            <td class="px-4 py-4">118/78</td>
                            <td class="px-4 py-4">105</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
