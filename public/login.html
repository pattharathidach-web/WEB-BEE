<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ตลาดสดใส ใส่ใจน้ำตาล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%9A</text></svg>">
    <link rel="stylesheet" href="style.css">
    <noscript><style>html{visibility:visible!important}</style></noscript>
    <script src="auth.js"></script>
    <script>
        (function () {
            const u = getUser();
            if (u) {
                window.location.replace(u.role === 'nurse' ? 'dashboard-nurse.html' : 'dashboard-emp.html');
            } else {
                document.documentElement.style.visibility = 'visible';
            }
        })();
    </script>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen flex flex-col justify-between items-center p-6">
    
    <div id="loginCard" class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 mt-12 transition-shadow hover:shadow-2xl">
        <!-- Logo -->
        <div class="flex justify-center items-center gap-4 mb-8">
            <div class="text-emerald-600 font-bold text-lg flex items-center gap-1">💚 ตลาดสดใส<br><span class="text-xs text-gray-500">ใส่ใจน้ำตาล</span></div>
            <div class="text-gray-300 text-2xl">|</div>
            <div class="text-emerald-800 font-bold text-lg">BEE <span class="text-xs font-normal block text-gray-500">CSR</span></div>
        </div>

        <h2 class="text-center text-xl font-bold text-gray-700 mb-6">เข้าสู่ระบบ</h2>

        <!-- Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Username</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้ (nurse หรือ employee)" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" required>
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Password</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" required>
            </div>
            <p id="loginError" class="text-red-500 text-xs hidden">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl transition duration-200 shadow-md">เข้าสู่ระบบ</button>
        </form>

        <div class="text-center mt-4">
            <a href="#" class="text-xs text-blue-500 hover:underline">ลืมรหัสผ่าน?</a>
        </div>
        <p class="text-center text-[11px] text-gray-400 mt-3">Demo: username <b>nurse</b> หรือ <b>employee</b> / รหัสผ่าน <b>1234</b></p>
    </div>

    <p class="text-xs text-gray-400 mt-8">© 2025 BST CSR | ตลาดสดใส ใส่ใจน้ำตาล</p>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const submitBtn = this.querySelector('button[type="submit"]');

            // Demo user directory (ของจริงต้องตรวจสอบกับ server + hash รหัสผ่าน)
            const users = {
                nurse:    { password: '1234', role: 'nurse',    roleLabel: 'พยาบาล',  fullname: 'พยาบาลสมหญิง ใจดี' },
                employee: { password: '1234', role: 'employee', roleLabel: 'พนักงาน', fullname: 'นายสมชาย รักสุข' }
            };

            const match = users[username];
            if (!match || match.password !== password) {
                errorEl.classList.remove('hidden');
                const card = document.getElementById('loginCard');
                card.classList.remove('anim-shake');
                void card.offsetWidth; // reflow เพื่อ restart animation
                card.classList.add('anim-shake');
                return;
            }

            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';
            setUser({ username, role: match.role, roleLabel: match.roleLabel, fullname: match.fullname });
            window.location.href = match.role === 'nurse' ? 'dashboard-nurse.html' : 'dashboard-emp.html';
        });
    </script>
</body>
</html>
