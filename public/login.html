<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ตลาดสดใส ใส่ใจน้ำตาล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen flex flex-col justify-between items-center p-6">
    
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 mt-12">
        <!-- Logo -->
        <div class="flex justify-center items-center gap-4 mb-8">
            <div class="text-emerald-600 font-bold text-lg flex items-center gap-1">💚 ตลาดสดใส<br><span class="text-xs text-gray-500">ใส่ใจน้ำตาล</span></div>
            <div class="text-gray-300 text-2xl">|</div>
            <div class="text-emerald-800 font-bold text-lg">BEE <span class="text-xs font-normal block text-gray-500">CSR</span></div>
        </div>

        <h2 class="text-center text-xl font-bold text-gray-700 mb-6">เข้าสู่ระบบ</h2>

        <!-- Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Username</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้ (nurse หรือ employee)" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" required>
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Password</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" required>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl transition duration-200 shadow-md">เข้าสู่ระบบ</button>
        </form>

        <div class="text-center mt-4">
            <a href="#" class="text-xs text-blue-500 hover:underline">ลืมรหัสผ่าน?</a>
        </div>
    </div>

    <p class="text-xs text-gray-400 mt-8">© 2025 BST CSR | ตลาดสดใส ใส่ใจน้ำตาล</p>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            // จำลองการเปลี่ยนหน้าตาม Role ตัวอย่างในภาพ
            if(user === 'nurse') window.location.href = '/dashboard-nurse';
            else window.location.href = '/dashboard-emp';
        });
    </script>
</body>
</html>
