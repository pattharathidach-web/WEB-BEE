<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติข้อมูลสุขภาพ - ตลาดสดใส ใส่ใจน้ำตาล</title>
    <link rel="stylesheet" href="tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%9A</text></svg>">
    <link rel="stylesheet" href="style.css">
    <noscript><style>html{visibility:visible!important;opacity:1!important}</style></noscript>
    <script src="auth.js"></script>
    <script>window.__user = guardPage('nurse');</script>
</head>
<body class="bg-green-50/50 min-h-screen flex">

    <!-- Sidebar โทนเขียว -->
    <aside class="w-64 bg-emerald-800 text-emerald-50 flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 p-2 mb-6 bg-white/10 rounded-xl">
                <span class="font-bold text-white text-sm">ตลาดสดใส ใส่ใจน้ำตาล</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard-nurse.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-xl text-sm transition">🏠 หน้าหลัก</a>
                <a aria-current="page" href="history.html" class="flex items-center gap-3 px-4 py-3 bg-emerald-600 text-white rounded-xl text-sm shadow-sm">🔍 ค้นหาประวัติผู้ป่วย</a>
                <a href="report.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-xl text-sm transition">📊 รายงานการตรวจสุขภาพ</a>
            </nav>
        </div>
        <a href="#" onclick="logout(); return false;" class="flex items-center gap-3 px-4 py-3 hover:bg-red-500/20 text-red-300 rounded-xl text-sm transition">🚪 ออกจากระบบ</a>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        <div class="bg-white p-8 rounded-2xl shadow-sm">
            
            <!-- Header & Breadcrumb -->
            <div class="mb-6 border-b pb-4">
                <h2 class="text-xl font-bold text-gray-800">ประวัติข้อมูลสุขภาพ</h2>
                <p class="text-sm text-gray-500 mt-1">หน้าหลัก / ค้นหาประวัติผู้ป่วย</p>
            </div>

            <!-- Search Box -->
            <div class="bg-slate-50 p-6 rounded-xl border border-slate-100 mb-8">
                <label class="block text-sm font-medium text-gray-700 mb-2">ค้นหาผู้ป่วย</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="searchInput" placeholder="ชื่อ-นามสกุล หรือ เลขบัตรประชาชน" class="flex-1 px-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    <button id="searchBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-2.5 rounded-xl font-medium transition shadow-sm whitespace-nowrap">
                        ค้นหา
                    </button>
                </div>
            </div>

            <!-- History Table -->
            <div>
                <h3 class="font-bold text-gray-700 mb-4" id="resultTitle">ประวัติการตรวจทั้งหมด</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-500 bg-slate-50 border-y">
                            <tr>
                                <th class="px-4 py-3 font-medium">ชื่อ-นามสกุล</th>
                                <th class="px-4 py-3 font-medium">วันที่</th>
                                <th class="px-4 py-3 font-medium">น้ำหนัก (kg)</th>
                                <th class="px-4 py-3 font-medium">BMI</th>
                                <th class="px-4 py-3 font-medium">ความดันโลหิต</th>
                                <th class="px-4 py-3 font-medium">น้ำตาล (mg/dL)</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody" class="divide-y divide-gray-100">
                        </tbody>
                    </table>
                    <p id="emptyState" class="text-center text-sm text-gray-400 py-8 hidden">ไม่พบข้อมูล</p>
                </div>
            </div>

        </div>
    </main>

    <script src="data.js"></script>
    <script>

        function cell(text, className) {
            const td = document.createElement('td');
            td.className = className;
            td.textContent = text;
            return td;
        }

        function renderRows(records) {
            const body = document.getElementById('resultsBody');
            const empty = document.getElementById('emptyState');
            body.innerHTML = '';
            if (records.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            records
                .slice()
                .sort((a, b) => String(a.date).localeCompare(String(b.date)))
                .forEach(r => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition';
                    tr.append(
                        cell(r.fullname, 'px-4 py-4 text-gray-700'),
                        cell(formatThaiDate(r.date), 'px-4 py-4 text-gray-700'),
                        cell(r.weight, 'px-4 py-4 text-gray-700'),
                        cell(r.bmi, 'px-4 py-4 text-emerald-600 font-medium'),
                        cell(r.bp, 'px-4 py-4 text-gray-700'),
                        cell(r.sugar, 'px-4 py-4 text-gray-700')
                    );
                    body.appendChild(tr);
                });
        }

        async function doSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            document.getElementById('resultTitle').textContent = q ? `ผลการค้นหา: "${q}"` : 'ประวัติการตรวจทั้งหมด';
            try {
                renderRows(await getRecords({ search: q }));
            } catch (error) {
                document.getElementById('emptyState').textContent = error.message;
                renderRows([]);
            }
        }

        document.getElementById('searchBtn').addEventListener('click', doSearch);
        document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
        doSearch();
    </script>
</body>
</html>
