<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางกิจกรรม CSR - ตลาดสดใส ใส่ใจน้ำตาล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%9A</text></svg>">
    <link rel="stylesheet" href="style.css">
    <noscript><style>html{visibility:visible!important}</style></noscript>
    <script src="auth.js"></script>
    <script>window.__user = guardPage('employee');</script>
</head>
<body class="bg-green-50/50 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-emerald-800 text-emerald-50 flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 p-2 mb-6 bg-white/10 rounded-xl">
                <span class="text-xl">💚</span>
                <span class="font-bold text-white text-sm">ตลาดสดใส ใส่ใจน้ำตาล</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard-emp.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-xl text-sm transition">🏠 หน้าหลัก</a>
                <a href="history-emp.html" class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-xl text-sm transition">📊 ข้อมูลสุขภาพย้อนหลัง</a>
                <a aria-current="page" href="csr-schedule.html" class="flex items-center gap-3 px-4 py-3 bg-emerald-600 text-white rounded-xl text-sm shadow-sm">📅 ตารางกิจกรรม CSR</a>
            </nav>
        </div>
        <a href="#" onclick="logout(); return false;" class="flex items-center gap-3 px-4 py-3 hover:bg-red-500/20 text-red-300 rounded-xl text-sm transition">🚪 ออกจากระบบ</a>
    </aside>

    <main class="flex-1 p-8">
        <h2 class="text-2xl font-bold text-emerald-800 mb-6">ตารางกิจกรรม CSR เร็วๆ นี้</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Event 1 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50 flex gap-4">
                <div class="bg-emerald-100 text-emerald-700 rounded-xl p-4 flex flex-col items-center justify-center min-w-[80px]">
                    <span class="text-sm font-bold">พ.ค.</span>
                    <span class="text-2xl font-bold">18</span>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-lg">ตรวจสุขภาพตลาดหนองแฟบ</h3>
                    <p class="text-sm text-gray-500 mt-1">เวลา: 08:00 - 12:00 น.</p>
                    <p class="text-sm text-gray-500">สถานที่: ตลาดหนองแฟบ จ.ระยอง</p>
                    <button id="registerBtn" class="mt-3 bg-emerald-600 text-white text-xs px-4 py-1.5 rounded-lg hover:bg-emerald-700">ลงทะเบียนเข้าร่วม</button>
                </div>
            </div>

            <!-- Event 2 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50 flex gap-4 opacity-75">
                <div class="bg-gray-100 text-gray-600 rounded-xl p-4 flex flex-col items-center justify-center min-w-[80px]">
                    <span class="text-sm font-bold">เม.ย.</span>
                    <span class="text-2xl font-bold">05</span>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-lg">อบรมให้ความรู้เรื่องเบาหวาน</h3>
                    <p class="text-sm text-gray-500 mt-1">เวลา: 13:00 - 16:00 น.</p>
                    <span class="inline-block mt-2 bg-gray-200 text-gray-600 text-xs px-3 py-1 rounded-full">กิจกรรมสิ้นสุดแล้ว</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const btn = document.getElementById('registerBtn');
        btn.addEventListener('click', function () {
            btn.textContent = 'ลงทะเบียนแล้ว ✓';
            btn.disabled = true;
            btn.className = 'mt-3 bg-gray-300 text-gray-600 text-xs px-4 py-1.5 rounded-lg cursor-not-allowed';
        });
    </script>
</body>
</html>
