<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกข้อมูลสุขภาพ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex">

    <!-- Sidebar (เหมือนกันเพื่อความเป็นเอกภาพ) -->
    <aside class="w-64 bg-[#0A2540] text-slate-300 flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 p-2 mb-6 bg-white/10 rounded-xl"><span class="font-bold text-white text-sm">ตลาดสดใส ใส่ใจน้ำตาล</span></div>
            <nav class="space-y-1">
                <a href="/dashboard-nurse" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-xl text-sm">🏠 หน้าหลัก</a>
                <a href="/record-health" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl text-sm">📝 บันทึกข้อมูลสุขภาพ</a>
                <a href="/history" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-xl text-sm">🔍 ค้นหาประวัติผู้ป่วย</a>
                <a href="/report" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-xl text-sm">📊 รายงานการตรวจสุขภาพ</a>
            </nav>
        </div>
        <a href="/logout" class="flex items-center gap-3 px-4 py-3 text-red-400">🚪 ออกจากระบบ</a>
    </aside>

    <!-- Main Form Content -->
    <main class="flex-1 p-8">
        <div class="max-w-3xl bg-white p-8 rounded-2xl shadow-sm mx-auto">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-4 mb-6">บันทึกข้อมูลสุขภาพ (พยาบาล)</h2>
            
            <form class="space-y-6">
                <!-- Row 1: Search Patient -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm text-gray-600 mb-1">ชื่อ-นามสกุล</label>
                        <input type="text" placeholder="นายสมชาย รักสุข" class="w-full px-4 py-2 border rounded-xl bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">เลขบัตรประชาชน</label>
                        <div class="flex gap-2">
                            <input type="text" placeholder="1-2345-67890-12-3" class="w-full px-3 py-2 border rounded-xl text-sm">
                            <button type="button" class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-xs whitespace-nowrap">🔍 ค้นหา</button>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Vitals -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">น้ำหนัก (kg)</label>
                        <input type="number" placeholder="65" class="w-full px-4 py-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">ส่วนสูง (cm)</label>
                        <input type="number" placeholder="170" class="w-full px-4 py-2 border rounded-xl">
                    </div>
                </div>

                <!-- Row 3: BP & Sugar -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">ความดันโลหิต (mmHg)</label>
                        <input type="text" placeholder="120 / 80" class="w-full px-4 py-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">น้ำตาลในเลือด (mg/dL)</label>
                        <input type="number" placeholder="110" class="w-full px-4 py-2 border rounded-xl">
                    </div>
                </div>

                <!-- Row 4: Note -->
                <div>
                    <label class="block text-sm text-gray-600 mb-1">หมายเหตุ</label>
                    <textarea placeholder="กรอกหมายเหตุ (ถ้ามี)" rows="3" class="w-full px-4 py-2 border rounded-xl"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="history.back()" class="px-6 py-2 border rounded-xl text-gray-600 hover:bg-slate-100">ยกเลิก</button>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 shadow-md">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
